name: Deploy site to GitHub Pages

# Replaces the legacy "deploy from a branch" Pages builder, which ran
# Jekyll over docs/ and reported failures only as "Page build failed"
# with no readable log. The site is plain static HTML/CSS/JS, so this
# just uploads docs/ as-is -- and when something does go wrong, there's
# an actual log to read.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than cancelling them: several pushes in quick
# succession should all land in order, not abort each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
