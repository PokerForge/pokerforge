name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      # Runners have no real desktop session — without this, every test
      # that constructs a QApplication would fail trying to use the
      # default "windows" platform plugin. Verified locally that the
      # full suite passes under this exact setting.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest
